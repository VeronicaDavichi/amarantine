<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amarantine 人工标注</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --muted:#98a1b2;
    --accent:#6aa6ff; --ok:#35c37d; --bad:#ff6b6b; --warn:#f0b849;
    --l0:#7a8090; --l1:#5b8def; --l2:#33b1a5; --l3:#c08a2e; --l4:#d2566b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;background:rgba(15,17,21,.97);z-index:10;
         border-bottom:1px solid var(--line);padding:12px 20px;
         display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
       color:var(--muted);background:transparent}
  .tab.active{border-color:var(--accent);color:var(--text);background:#1b2433}
  .spacer{flex:1}
  button{font:inherit;color:var(--text);background:#1e232c;border:1px solid var(--line);
         border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  main{max-width:1000px;margin:0 auto;padding:20px}
  .progress{color:var(--muted);font-size:13px}
  .bar{height:6px;background:#1b2029;border-radius:4px;overflow:hidden;margin:6px 0 16px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .evidence{margin:14px 0;padding:14px;background:#11141a;border-left:3px solid var(--accent);
            border-radius:6px;white-space:pre-wrap;word-break:break-word}
  .machine{margin:8px 0;color:var(--muted)}
  .machine b{color:var(--text)}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
  .field{flex:1;min-width:260px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  select,input[type=text]{width:100%;background:#11141a;color:var(--text);
       border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  .intensity{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .intensity button{padding:10px 14px;border-radius:10px;border-width:2px}
  .intensity button.sel{background:#10151d}
  .intensity button[data-level="0"].sel{border-color:var(--l0)}
  .intensity button[data-level="1"].sel{border-color:var(--l1)}
  .intensity button[data-level="2"].sel{border-color:var(--l2)}
  .intensity button[data-level="3"].sel{border-color:var(--l3)}
  .intensity button[data-level="4"].sel{border-color:var(--l4)}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .note{width:100%;margin-top:10px;background:#11141a;color:var(--text);
        border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  .note:focus{outline:none;border-color:var(--accent)}
  .note::placeholder{color:var(--muted)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav button{min-width:120px}
  #jsontext{resize:vertical}
  .missing{color:var(--warn)}
  .done{color:var(--ok)}
  .tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .tag.hit{border-color:var(--warn);color:var(--warn)}
  .tag.miss{border-color:var(--muted);color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<header>
  <h1>amarantine 人工标注</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button id="showjson">显示 JSON（可复制）</button>
  <button id="export">下载 JSON</button>
  <button id="reset">清空本组</button>
</header>
<main>
  <div class="progress" id="progress"></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="app"></div>
  <div id="jsonbox" style="display:none;margin-top:16px">
    <div class="progress">全选（Ctrl+A）→ 复制（Ctrl+C），或者点下面的「复制到剪贴板」</div>
    <textarea id="jsontext" class="note" style="height:220px;font-family:Consolas,monospace;font-size:12px"></textarea>
    <div class="nav">
      <button id="copyjson">复制到剪贴板</button>
      <button id="hidejson">收起</button>
    </div>
  </div>
</main>
<footer>数据来自 <code>docs/labeling-data.js</code> · 标注保存在浏览器 localStorage（换浏览器不同步）</footer>

<script src="labeling-data.js"></script>
<script>
(function () {
  const DATA = window.LABEL_DATA || {};
  const POOL = (DATA.entity_pool || []).slice(0, 400);
  const LEVELS = [
    [0, "0 无关系"],
    [1, "1 极低 · 依赖 (DEPENDS_ON)"],
    [2, "2 有关系 · 协作 (COLLABORATES)"],
    [3, "3 较大 · 维护 (MAINTAINS)"],
    [4, "4 强相关 · 负责 (OWNS)"],
  ];
  const GROUPS = [
    { key: "statements", name: "关系陈述", kind: "relation" },
    { key: "behaviors", name: "关系行为", kind: "relation" },
    { key: "senses", name: "指称义项", kind: "sense" },
  ];
  const STORE = "amarantine-label-v2";
  let state = load();
  let gi = 0, idx = 0;

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; }
  }
  function save() {
    localStorage.setItem(STORE, JSON.stringify(state));
    localStorage.setItem(STORE + "-at", new Date().toISOString());
  }
  const items = () => DATA[GROUPS[gi].key] || [];
  const labelOf = id => state[id] || null;
  const isDone = x => {
    const s = labelOf(x.id);
    if (!s) return false;
    return GROUPS[gi].kind === "relation" ? s.intensity !== undefined : !!s.label;
  };
  function firstUnlabeled() {
    const i = items().findIndex(x => !isDone(x));
    return i < 0 ? 0 : i;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML = "";
    GROUPS.forEach((g, i) => {
      const list = DATA[g.key] || [];
      const done = list.filter(x => {
        const s = labelOf(x.id);
        return s && (g.kind === "relation" ? s.intensity !== undefined : !!s.label);
      }).length;
      const b = document.createElement("div");
      b.className = "tab" + (i === gi ? " active" : "");
      b.textContent = `${g.name} ${done}/${list.length}`;
      b.onclick = () => { gi = i; idx = firstUnlabeled(); render(); };
      el.appendChild(b);
    });
  }
  function renderProgress() {
    const list = items();
    const done = list.filter(x => {
      const s = labelOf(x.id);
      return s && (GROUPS[gi].kind === "relation" ? s.intensity !== undefined : !!s.label);
    }).length;
    document.getElementById("progress").textContent =
      `${GROUPS[gi].name}：${done}/${list.length} 已标（${idx + 1}）`;
    document.getElementById("bar").style.width = list.length ? (done / list.length * 100) + "%" : "0";
  }

  function entityOptions(item, selected, kind) {
    const own = item.entities || [];
    const ownNames = own.map(e => e.name);
    const rest = POOL.filter(n => !ownNames.includes(n));
    let html = `<option value="">— 请选择 —</option>`;
    html += `<optgroup label="本句抽到的实体">`;
    own.forEach(e => {
      html += `<option value="${esc(e.name)}"${selected === e.name ? " selected" : ""}>`
            + `${esc(e.name)}（${esc(e.kind || "?")}）</option>`;
    });
    html += `</optgroup><optgroup label="全局实体池">`;
    rest.forEach(n => {
      html += `<option value="${esc(n)}"${selected === n ? " selected" : ""}>${esc(n)}</option>`;
    });
    html += `</optgroup><option value="__manual__"${selected === "__manual__" ? " selected" : ""}>✏️ 没抽中，手动输入…</option>`;
    return html;
  }

  function render() {
    renderTabs();
    renderProgress();
    const list = items();
    const app = document.getElementById("app");
    if (!list.length) { app.innerHTML = '<div class="empty">这一组没有数据</div>'; return; }
    idx = Math.max(0, Math.min(idx, list.length - 1));
    const item = list[idx];
    const g = GROUPS[gi];
    const lb = labelOf(item.id) || {};

    let head = `<div class="card"><div class="meta"><span>${idx + 1} / ${list.length}</span>
      <span>${esc(item.id)}</span>`;
    if (item.source === "rule_hit") head += `<span class="tag hit">规则抽取</span>`;
    if (item.source === "rule_miss") head += `<span class="tag miss">规则未抽</span>`;
    if (item.kind === "behavior") head += `<span>证据 ${item.evidence_count || 0} 条</span>`;
    head += `</div>`;

    let body = "";
    if (item.kind === "statement") {
      body += `<div class="evidence">${esc(item.evidence)}</div>`;
      body += `<div class="machine">规则结果：` + (item.machine && item.machine.extracted
        ? `<b>${esc(item.machine.head)}</b> --${esc(item.machine.predicate)}--> <b>${esc(item.machine.tail)}</b>`
        : `<b>未抽取</b>（规则漏掉）`) + `</div>`;
    } else if (item.kind === "behavior") {
      body += `<div class="machine"><b>${esc(item.person)}</b> --${esc(item.verb)}--> <b>${esc(item.target)}</b></div>`;
      (item.evidence || []).forEach(t => body += `<div class="evidence">${esc(t)}</div>`);
    } else {
      body += `<div class="machine">词：<b>${esc(item.term)}</b> → 机器解释：<b>${esc(item.gloss)}</b>（score ${item.score}）</div>`;
      (item.evidence || []).forEach(t => body += `<div class="evidence">${esc(t)}</div>`);
    }

    if (g.kind === "relation") {
      const headSel = lb.head && lb.head.custom ? "__manual__" : (lb.head && lb.head.name) || "";
      const tailSel = lb.tail && lb.tail.custom ? "__manual__" : (lb.tail && lb.tail.name) || "";
      body += `<div class="row">
        <div class="field"><label>主语（谁）</label>
          <select id="head">${entityOptions(item, headSel, "head")}</select>
          <input type="text" id="head_custom" placeholder="手动输入主语"
                 value="${esc(lb.head && lb.head.custom ? lb.head.name : "")}"
                 style="margin-top:6px;display:${headSel === "__manual__" ? "block" : "none"}">
        </div>
        <div class="field"><label>宾语（对谁 / 什么）</label>
          <select id="tail">${entityOptions(item, tailSel, "tail")}</select>
          <input type="text" id="tail_custom" placeholder="手动输入宾语"
                 value="${esc(lb.tail && lb.tail.custom ? lb.tail.name : "")}"
                 style="margin-top:6px;display:${tailSel === "__manual__" ? "block" : "none"}">
        </div>
      </div>`;
      body += `<div class="hint">如果表里没有你要的实体 → 选「✏️ 没抽中，手动输入」，我会据此补实体抽取</div>`;
      body += `<div class="intensity">`;
      LEVELS.forEach(([lv, text]) => {
        body += `<button data-level="${lv}" class="${lb.intensity === lv ? "sel" : ""}">${text}</button>`;
      });
      body += `</div>`;
      if (lb.intensity !== undefined) {
        body += `<div class="hint done">已标：${LEVELS.find(l => l[0] === lb.intensity)[1]}`
             + (lb.head ? ` · 主语 ${esc(lb.head.name)}` : "")
             + (lb.tail ? ` → ${esc(lb.tail.name)}` : "") + `</div>`;
      }
    } else {
      const senses = [["ok", "正确（确实指这个意思）"], ["bad", "错误（指别的/误绑）"], ["warn", "不确定"]];
      body += `<div class="row" style="margin-top:16px">`;
      senses.forEach(([k, t]) => {
        body += `<button class="sense" data-key="${k}" style="border-color:${k === "ok" ? "var(--ok)" : k === "bad" ? "var(--bad)" : "var(--warn)"}">${t}</button>`;
      });
      body += `</div>`;
      if (lb.label) body += `<div class="hint done">已标：${lb.label}</div>`;
    }

    body += `<input type="text" class="note" id="note" placeholder="备注（可选）" value="${esc(lb.note || "")}">`;
    body += `<div class="nav">
      <button id="prev">← 上一页</button>
      <button id="next">下一页 →</button>
    </div>`;
    body += `<div class="hint">快捷键：${g.kind === "relation" ? "0–4 选强度" : "1 正确 · 2 错误 · 3 不确定"} · 备注失焦自动保存</div>`;

    app.innerHTML = head + body + `</div>`;
    wire(item, g);
  }

  function wire(item, g) {
    document.getElementById("prev").onclick = () => {
      const list = items();
      idx = (idx - 1 + list.length) % list.length;
      render();
    };
    document.getElementById("next").onclick = () => {
      const list = items();
      idx = (idx + 1) % list.length;
      render();
    };
    const note = document.getElementById("note");
    note.onchange = () => {
      state[item.id] = state[item.id] || {};
      state[item.id].note = note.value.trim();
      save();
    };
    if (g.kind === "relation") {
      const headSel = document.getElementById("head");
      const tailSel = document.getElementById("tail");
      const headCustom = document.getElementById("head_custom");
      const tailCustom = document.getElementById("tail_custom");
      const pick = (which, sel, custom) => {
        state[item.id] = state[item.id] || {};
        if (sel.value === "__manual__") {
          custom.style.display = "block";
          custom.focus();
          state[item.id][which] = { name: custom.value.trim(), custom: true };
        } else if (sel.value) {
          custom.style.display = "none";
          state[item.id][which] = { name: sel.value, custom: false };
        }
        save();
      };
      headSel.onchange = () => pick("head", headSel, headCustom);
      tailSel.onchange = () => pick("tail", tailSel, tailCustom);
      headCustom.onchange = () => {
        state[item.id] = state[item.id] || {};
        state[item.id].head = { name: headCustom.value.trim(), custom: true };
        save();
      };
      tailCustom.onchange = () => {
        state[item.id] = state[item.id] || {};
        state[item.id].tail = { name: tailCustom.value.trim(), custom: true };
        save();
      };
      document.querySelectorAll(".intensity button").forEach(b => {
        b.onclick = () => {
          state[item.id] = state[item.id] || {};
          state[item.id].intensity = Number(b.dataset.level);
          state[item.id].at = new Date().toISOString();
          if (!state[item.id].head && headSel.value && headSel.value !== "__manual__")
            state[item.id].head = { name: headSel.value, custom: false };
          if (!state[item.id].tail && tailSel.value && tailSel.value !== "__manual__")
            state[item.id].tail = { name: tailSel.value, custom: false };
          save();
          next();
        };
      });
    } else {
      document.querySelectorAll(".sense").forEach(b => {
        b.onclick = () => {
          state[item.id] = state[item.id] || {};
          state[item.id].label = b.dataset.key;
          state[item.id].at = new Date().toISOString();
          save();
          next();
        };
      });
    }
  }

  function next() {
    const list = items();
    const after = list.findIndex((x, i) => i > idx && !isDone(x));
    idx = after >= 0 ? after : (idx + 1) % list.length;
    render();
  }

  function buildExport() {
    const out = { exported_at: new Date().toISOString(), generated_at: DATA.generated_at || "", labels: state, summary: {} };
    GROUPS.forEach(g => {
      const list = DATA[g.key] || [];
      const done = list.filter(x => {
        const s = labelOf(x.id);
        return s && (g.kind === "relation" ? s.intensity !== undefined : !!s.label);
      }).length;
      out.summary[g.key] = { total: list.length, labeled: done };
    });
    return out;
  }
  window.amarantineExport = buildExport;

  document.getElementById("showjson").onclick = () => {
    const box = document.getElementById("jsonbox");
    const ta = document.getElementById("jsontext");
    ta.value = JSON.stringify(buildExport(), null, 1);
    box.style.display = "block";
    ta.focus();
    ta.select();
  };
  document.getElementById("hidejson").onclick = () => {
    document.getElementById("jsonbox").style.display = "none";
  };
  document.getElementById("copyjson").onclick = async () => {
    const ta = document.getElementById("jsontext");
    ta.focus();
    ta.select();
    try {
      await navigator.clipboard.writeText(ta.value);
      alert("已复制到剪贴板，直接粘贴即可");
      return;
    } catch (e) { /* 剪贴板 API 可能被 file:// 禁用，走兜底 */ }
    try {
      document.execCommand("copy");
      alert("已复制到剪贴板，直接粘贴即可");
    } catch (e) {
      alert("自动复制失败：请按 Ctrl+A 全选，再按 Ctrl+C 复制");
    }
  };

  document.getElementById("export").onclick = () => {
    const blob = new Blob([JSON.stringify(buildExport(), null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `labeling-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById("reset").onclick = () => {
    if (!confirm("清空这一组的标注？（只清当前标签页）")) return;
    (DATA[GROUPS[gi].key] || []).forEach(x => delete state[x.id]);
    save();
    render();
  };
  document.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "INPUT") return;
    const g = GROUPS[gi];
    if (g.kind === "relation" && /^[0-4]$/.test(e.key)) {
      const b = document.querySelector(`.intensity button[data-level="${e.key}"]`);
      if (b) b.click();
    } else if (g.kind === "sense") {
      const map = { "1": "ok", "2": "bad", "3": "warn" };
      if (map[e.key]) document.querySelector(`.sense[data-key="${map[e.key]}"]`)?.click();
    }
    // 翻页只走按钮：实测左右键容易在填备注时误触
  });

  idx = firstUnlabeled();
  render();
})();
</script>
</body>
</html>
