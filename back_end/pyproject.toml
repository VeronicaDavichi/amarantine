[project]
name = "amarantine-memory"
version = "0.1.0"
description = "Long-term memory service for LLM agents — MCP stdio tools + local admin channel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]>=0.30,<1",
    "pydantic==2.11.7",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.13,<2",
    "aiosqlite>=0.20,<1",
    "weaviate-client>=4.9,<5",
    "neo4j>=5.25,<6",
    "openai>=1.60,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    # 中文分词 + 词性标注。用来抽人名/地名/机构名和动词。
    # 没有它时 labeler 会降级到正则路径（能力弱但零依赖），所以不是硬依赖；
    # 但强烈建议装 —— 正则没有词边界，`张三让李四去做项目A` 会抽歪。
    "jieba>=0.42,<0.43",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "jsonschema>=4.23,<5",
]

[project.scripts]
memory-mcp = "memory.entrypoints.mcp_stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
